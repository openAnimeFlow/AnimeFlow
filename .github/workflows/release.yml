name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
      platform:
        type: choice
        description: "选择构建的平台"
        options:
          - android
          - ios
          - macos
          - windows
          - linux
          - all
        default: all

env:
  ANIME_FLOW_APP_ID: ${{ secrets.ANIME_FLOW_APP_ID }}
  ANIME_FLOW_SECRET: ${{ secrets.ANIME_FLOW_SECRET }}

jobs:
  resolve-source:
    name: Resolve release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Resolve the selected remote tag
        id: source
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: bash tool/ci/resolve_release_source.sh

  quality:
    needs: resolve-source
    uses: ./.github/workflows/quality.yml
    with:
      source_sha: ${{ needs.resolve-source.outputs.source_sha }}

  build-ios:
    needs: [resolve-source, quality]
    name: Build iOS
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}

      - name: Extract version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "INSTALLER_VERSION=${VERSION%%+*}" >> $GITHUB_ENV

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Install ECH native build tools on Apple runners
        run: brew install cmake ninja

      - name: Validate API signature env
        shell: bash
        run: |
          if [ -z "$ANIME_FLOW_APP_ID" ] || [ -z "$ANIME_FLOW_SECRET" ]; then
            echo "::error::ANIME_FLOW_APP_ID and ANIME_FLOW_SECRET must be set (repository secrets)."
            exit 1
          fi

      - name: Show available simulators
        run: |
          xcrun simctl list devices
          xcodebuild -showsdks

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=ANIME_FLOW_APP_ID="$ANIME_FLOW_APP_ID" \
            --dart-define=ANIME_FLOW_SECRET="$ANIME_FLOW_SECRET"

      - name: Create IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -q -r "AnimeFlow-ios-${{ env.VERSION }}.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: ios
          path: AnimeFlow-ios-${{ env.VERSION }}.ipa

  build-android:
    needs: [resolve-source, quality]
    name: Build Android
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}

      - name: Extract version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "INSTALLER_VERSION=${VERSION%%+*}" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Validate API signature env
        shell: bash
        run: |
          if [ -z "$ANIME_FLOW_APP_ID" ] || [ -z "$ANIME_FLOW_SECRET" ]; then
            echo "::error::ANIME_FLOW_APP_ID and ANIME_FLOW_SECRET must be set (repository secrets)."
            exit 1
          fi

      - name: Setup Android signing
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/key.jks
          fi
          mkdir -p android
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS || 'key' }}
          storeFile=key.jks
          EOF
          if [ -f android/app/key.jks ]; then
            echo "Key store file exists"
            ls -lh android/app/key.jks
          else
            echo "Warning: Key store file not found, build will use debug signing"
          fi

      - name: Build APK
        shell: bash
        run: |
          flutter --version
          flutter build apk --split-per-abi --release \
            --dart-define=ANIME_FLOW_APP_ID="$ANIME_FLOW_APP_ID" \
            --dart-define=ANIME_FLOW_SECRET="$ANIME_FLOW_SECRET"
          echo "Android build completed"

      - name: Rename APK files
        shell: bash
        run: |
          cd build/app/outputs/flutter-apk
          if [ -f app-armeabi-v7a-release.apk ]; then
            mv app-armeabi-v7a-release.apk "AnimeFlow-android-v7a-${{ env.VERSION }}.apk"
          fi
          if [ -f app-arm64-v8a-release.apk ]; then
            mv app-arm64-v8a-release.apk "AnimeFlow-android-arm64-${{ env.VERSION }}.apk"
          fi
          if [ -f app-x86_64-release.apk ]; then
            mv app-x86_64-release.apk "AnimeFlow-android-x86_64-${{ env.VERSION }}.apk"
          fi
          ls -lh AnimeFlow-android-*.apk || true

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v6
        with:
          name: android
          path: build/app/outputs/flutter-apk/AnimeFlow-android-*.apk
          if-no-files-found: ignore

  build-windows:
    needs: [resolve-source, quality]
    name: Build Windows
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}

      - name: Extract version (Windows)
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:' | ForEach-Object { $_.Line -replace 'version: ', '' }).Trim()
          $semver = ($version -split '\+')[0].Trim()
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "INSTALLER_VERSION=$semver" >> $env:GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Validate API signature env (Windows)
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANIME_FLOW_APP_ID) -or [string]::IsNullOrWhiteSpace($env:ANIME_FLOW_SECRET)) {
            Write-Error 'ANIME_FLOW_APP_ID and ANIME_FLOW_SECRET must be set (repository secrets).'
            exit 1
          }

      - name: Build Windows
        shell: pwsh
        run: |
          flutter build windows `
            --dart-define=ANIME_FLOW_APP_ID=$env:ANIME_FLOW_APP_ID `
            --dart-define=ANIME_FLOW_SECRET=$env:ANIME_FLOW_SECRET
          echo "Windows build completed"

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "AnimeFlow-windows-${{ env.VERSION }}.zip" -Force
          echo "Created AnimeFlow-windows-${{ env.VERSION }}.zip"

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-Iscc {
            $candidates = @(
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
              (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
            )
            foreach ($candidate in $candidates) {
              if (Test-Path $candidate) { return $candidate }
            }
            return $null
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = Find-Iscc
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after Inno Setup install" }
          echo "ISCC_PATH=$iscc" >> $env:GITHUB_ENV
          $innoDir = Split-Path $iscc -Parent
          $langDir = Join-Path $innoDir 'Languages'
          if (-not (Test-Path $langDir)) { throw "Inno Setup Languages folder not found: $langDir" }
          $srcIsl = Join-Path $PWD 'assets\inno-setup\Chinese.isl'
          if (-not (Test-Path $srcIsl)) { throw "Missing repo file: $srcIsl" }
          Copy-Item -LiteralPath $srcIsl -Destination (Join-Path $langDir 'Chinese.isl') -Force

      - name: Patch installer.iss version and compile setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:INSTALLER_VERSION
          if ([string]::IsNullOrWhiteSpace($v)) { throw 'INSTALLER_VERSION is empty; check pubspec version line.' }
          $path = Join-Path $PWD 'installer.iss'
          $c = [System.IO.File]::ReadAllText($path, [System.Text.UTF8Encoding]::new($false))
          $defLine = [regex]::Match($c, '(?m)^\s*#define\s+MyAppVersion\s+"[^"]*"')
          if (-not $defLine.Success) { throw 'installer.iss: no line matching #define MyAppVersion "..."; cannot patch.' }
          $c = $c -replace '(?m)^\s*#define\s+MyAppVersion\s+"[^"]*"', "#define MyAppVersion    `"$v`""
          $mavLine = ($c -split "`r?`n" | Where-Object { $_ -match '^\s*#define\s+MyAppVersion\s+' } | Select-Object -First 1)
          if ($mavLine -notmatch [regex]::Escape($v)) { throw "installer.iss: MyAppVersion not updated to $v." }
          [System.IO.File]::WriteAllText($path, $c, [System.Text.UTF8Encoding]::new($false))
          Start-Process -FilePath $env:ISCC_PATH -ArgumentList "`"$path`"" -Wait -NoNewWindow
          $exe = "AnimeFlow-windows-setup-$v.exe"
          if (-not (Test-Path $exe)) { throw "Expected installer not found: $exe" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            AnimeFlow-windows-${{ env.VERSION }}.zip
            AnimeFlow-windows-setup-${{ env.INSTALLER_VERSION }}.exe
          if-no-files-found: ignore

  build-linux:
    needs: [resolve-source, quality]
    name: Build Linux
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}

      - name: Extract version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "INSTALLER_VERSION=${VERSION%%+*}" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Validate API signature env
        shell: bash
        run: |
          if [ -z "$ANIME_FLOW_APP_ID" ] || [ -z "$ANIME_FLOW_SECRET" ]; then
            echo "::error::ANIME_FLOW_APP_ID and ANIME_FLOW_SECRET must be set (repository secrets)."
            exit 1
          fi

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev unzip webkit2gtk-4.1 libasound2-dev libsecret-1-dev libmpv-dev
          sudo apt-get install -y gcc g++ autoconf automake debhelper glslang-dev ladspa-sdk xutils-dev libasound2-dev \
              libarchive-dev libbluray-dev libbs2b-dev libcaca-dev libcdio-paranoia-dev libdrm-dev \
              libdav1d-dev libdvdnav-dev libegl1-mesa-dev libepoxy-dev libfontconfig-dev libfreetype6-dev \
              libfribidi-dev libgl1-mesa-dev libgbm-dev libgme-dev libgsm1-dev libharfbuzz-dev libjpeg-dev \
              libbrotli-dev liblcms2-dev libmodplug-dev libmp3lame-dev libopenal-dev \
              libopus-dev libopencore-amrnb-dev libopencore-amrwb-dev libpulse-dev librtmp-dev \
              libsdl2-dev libsixel-dev libssh-dev libsoxr-dev libspeex-dev libtool \
              libv4l-dev libva-dev libvdpau-dev libvorbis-dev libvo-amrwbenc-dev \
              libunwind-dev libvpx-dev libwayland-dev libx11-dev libxext-dev \
              libxkbcommon-dev libxrandr-dev libxss-dev libxv-dev libxvidcore-dev \
              linux-libc-dev nasm ninja-build pkg-config python3 python3-docutils wayland-protocols \
              x11proto-core-dev zlib1g-dev libfdk-aac-dev libtheora-dev libwebp-dev \
              unixodbc-dev libpq-dev libxxhash-dev libaom-dev

      - name: Build Linux
        run: |
          flutter build linux \
            --dart-define=ANIME_FLOW_APP_ID="$ANIME_FLOW_APP_ID" \
            --dart-define=ANIME_FLOW_SECRET="$ANIME_FLOW_SECRET"
          echo "Linux build completed"

      - name: Create Linux TAR.GZ
        run: |
          cd build/linux/x64/release
          tar -czf ../../../../AnimeFlow-linux-${{ env.VERSION }}.tar.gz -C bundle .

      - name: Create DEB package
        run: |
          PACKAGE_NAME="animeflow"
          PACKAGE_DIR="animeflow_${{ env.VERSION }}_amd64"
          APP_DIR="${PACKAGE_DIR}/usr/lib/animeflow"
          mkdir -p ${PACKAGE_DIR}/DEBIAN
          mkdir -p ${APP_DIR}
          mkdir -p ${PACKAGE_DIR}/usr/bin
          mkdir -p ${PACKAGE_DIR}/usr/share/applications
          mkdir -p ${PACKAGE_DIR}/usr/share/pixmaps
          cp -r build/linux/x64/release/bundle/* ${APP_DIR}/
          cat > ${PACKAGE_DIR}/usr/bin/animeflow << 'EOF'
          #!/bin/bash
          cd /usr/lib/animeflow
          ./anime_flow "$@"
          EOF
          chmod +x ${PACKAGE_DIR}/usr/bin/animeflow
          cat > ${PACKAGE_DIR}/DEBIAN/control << EOF
          Package: ${PACKAGE_NAME}
          Version: ${{ env.VERSION }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: AnimeFlow Team
          Description: Anime video player
           AnimeFlow is an anime video player application.
          EOF
          cat > ${PACKAGE_DIR}/usr/share/applications/animeflow.desktop << EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=AnimeFlow
          Comment=Anime video player
          Exec=/usr/bin/animeflow
          Icon=animeflow
          Terminal=false
          Categories=Video;Player;
          EOF
          if [ -f build/linux/x64/release/bundle/data/flutter_assets/assets/logo/Logo.png ]; then
            cp build/linux/x64/release/bundle/data/flutter_assets/assets/logo/Logo.png ${PACKAGE_DIR}/usr/share/pixmaps/animeflow.png
          fi
          dpkg-deb --build ${PACKAGE_DIR} AnimeFlow-linux-${{ env.VERSION }}.deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux
          path: |
            AnimeFlow-linux-${{ env.VERSION }}.tar.gz
            AnimeFlow-linux-${{ env.VERSION }}.deb
          if-no-files-found: ignore

  build-macos:
    needs: [resolve-source, quality]
    name: Build macOS
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}

      - name: Extract version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "INSTALLER_VERSION=${VERSION%%+*}" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Install ECH native build tools on Apple runners
        run: brew install cmake ninja

      - name: Patch AVFoundation platform import for macOS SPM
        run: dart tool/patch_avfoundation_spm.dart

      - name: Validate API signature env
        shell: bash
        run: |
          if [ -z "$ANIME_FLOW_APP_ID" ] || [ -z "$ANIME_FLOW_SECRET" ]; then
            echo "::error::ANIME_FLOW_APP_ID and ANIME_FLOW_SECRET must be set (repository secrets)."
            exit 1
          fi

      - name: Build macOS
        run: |
          flutter build macos --release \
            --dart-define=ANIME_FLOW_APP_ID="$ANIME_FLOW_APP_ID" \
            --dart-define=ANIME_FLOW_SECRET="$ANIME_FLOW_SECRET"
          echo "macOS build completed"

      - name: Create DMG
        run: |
          mkdir -p build/dist
          cp -a build/macos/Build/Products/Release/*.app build/dist
          ln -s /Applications build/dist/Applications
          hdiutil create -fs HFS+ -volname "${{ env.VERSION }}" -srcfolder build/dist build/dist/AnimeFlow-macos-${{ env.VERSION }}.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos
          path: build/dist/AnimeFlow-macos-${{ env.VERSION }}.dmg
          if-no-files-found: ignore

  release:
    needs: [resolve-source, quality, build-ios, build-android, build-windows, build-linux, build-macos]
    # Unselected platforms are skipped; publish only after all selected builds succeed.
    if: >-
      ${{ !cancelled() &&
          !contains(needs.*.result, 'failure') &&
          !contains(needs.*.result, 'cancelled') &&
          needs.quality.result == 'success' &&
          (needs.build-ios.result == 'success' ||
           needs.build-android.result == 'success' ||
           needs.build-windows.result == 'success' ||
           needs.build-linux.result == 'success' ||
           needs.build-macos.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}

      - name: Extract version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Record release source
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          SOURCE_TAG: ${{ needs.resolve-source.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os
          with open('source-metadata.json', 'w', encoding='utf-8') as stream:
              json.dump({key: os.environ[key] for key in ['SOURCE_SHA', 'SOURCE_TAG', 'VERSION']}, stream, indent=2)
          PY

      - name: Generate release notes
        run: |
          CHANGELOG_CONTENT=$(cat .github/workflows/CHANGELOG.md)
          TEMPLATE=$(cat .github/workflows/release-template.md)
          RELEASE_NOTES=$(echo "$TEMPLATE" | awk -v changelog="$CHANGELOG_CONTENT" '
            /^---$/ {
              if (found_first == 0) {
                found_first = 1
                print changelog
                print ""
              }
            }
            { print }
          ')
          echo "$RELEASE_NOTES" > release_notes.md
          echo "Generated release notes:"
          cat release_notes.md
        env:
          VERSION: ${{ env.VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-source.outputs.tag }}
          target_commitish: ${{ needs.resolve-source.outputs.source_sha }}
          name: AnimeFlow ${{ env.VERSION }}
          body_path: release_notes.md
          files: |
            source-metadata.json
            artifacts/ios/*.ipa
            artifacts/android/*.apk
            artifacts/windows/*.zip
            artifacts/windows/*.exe
            artifacts/linux/*.tar.gz
            artifacts/linux/*.deb
            artifacts/macos/*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clear latest release cache
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ANIME_FLOW_APP_ID:-}" ] || \
             [ -z "${ANIME_FLOW_SECRET:-}" ]; then
            echo "::error::ANIME_FLOW_APP_ID and ANIME_FLOW_SECRET must be set (repository secrets)."
            exit 1
          fi

          API_PATH="/api/v1/releases/latest"
          TIMESTAMP="$(date +%s)"
          SIGNATURE_DATA="${ANIME_FLOW_APP_ID}${TIMESTAMP}${API_PATH}${ANIME_FLOW_SECRET}"
          SIGNATURE="$(printf '%s' "$SIGNATURE_DATA" | openssl dgst -sha256 -binary | base64 -w 0)"
          API_URL="https://ligg.top${API_PATH}"

          echo "Clearing latest release cache..."
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors \
            --request DELETE "$API_URL" \
            --header 'User-Agent: AnimeFlow-GitHubActions' \
            --header 'X-Auth: 1' \
            --header "X-AppId: ${ANIME_FLOW_APP_ID}" \
            --header "X-Timestamp: ${TIMESTAMP}" \
            --header "X-Signature: ${SIGNATURE}" \
            --write-out '\nHTTP status: %{http_code}\nRequest time: %{time_total}s\n'
          echo
          echo "Latest release cache cleared."
