name: Build and Deploy APT Repository

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-repository.yml"
      - "debs/**"
      - "depictions/**"
      - "scripts/update-repository.sh"
      - "CydiaIcon.png"
      - "index.html"
      - "sileo-featured.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes apt-utils xz-utils qrencode

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build repository
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SOURCE_URL: ${{ steps.pages.outputs.base_url }}
        run: ./scripts/update-repository.sh

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
