name: anime_flow
description: "A cross-platform anime video player with multiple data sources, real-time 4K upscaling, custom scraper configuration, danmaku, and Bangumi collection sync."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.4.0

environment:
  sdk: ">=3.3.4 <4.0.0"
  flutter: 3.47.2
# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # 提供 Flutter 内置组件的本地化资源和本地化框架。
    sdk: flutter
  intl: ^0.20.2 # 提供国际化、日期格式化、数字格式化和复数规则支持。

  # 用户界面与视觉组件
  cupertino_icons: ^1.0.8 # 提供 Flutter Cupertino 风格的图标资源。
  flutter_svg: ^2.2.3 # 解析并渲染 SVG 矢量图形。
  cached_network_image: ^3.4.1 # 加载网络图片并提供磁盘与内存缓存。
  shimmer: ^3.0.0 # 创建带有渐变闪烁效果的加载占位组件。
  photo_view: ^0.15.0 # 为图片提供缩放、平移和手势查看能力。
  lottie: ^3.3.3 # 解析并播放 Lottie 动画。
  bot_toast: ^4.1.3 # 在 Flutter 应用中显示全局 Toast、通知和自定义浮层。

  # 音视频播放与设备控制
  media_kit:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 994465d9bfca3f39d0b41199d16e7fd93fe97881
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 994465d9bfca3f39d0b41199d16e7fd93fe97881
      path: ./media_kit_video
  media_kit_libs_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 994465d9bfca3f39d0b41199d16e7fd93fe97881
      path: ./libs/universal/media_kit_libs_video
  canvas_danmaku: 0.3.3 # 使用 Flutter Canvas 绘制和管理弹幕。
  screen_brightness_platform_interface: ^2.1.0 # 定义屏幕亮度插件的跨平台接口契约。
  screen_brightness_android: ^2.1.3 # 提供 Android 平台的屏幕亮度插件实现。
  screen_brightness_ios: ^2.1.2 # 提供 iOS 平台的屏幕亮度插件实现。
  flutter_volume_controller: ^2.0.1 # 读取、监听和设置设备系统音量。

  # WebView 与网页容器
  webview_flutter: ^4.13.0 # 在 Flutter 中嵌入并控制原生 WebView。
  flutter_inappwebview_platform_interface: ^1.4.0-beta.3 # 定义 InAppWebView 插件的平台接口。
  flutter_inappwebview_ios: ^1.2.0-beta.3 # 提供 InAppWebView 的 iOS 平台实现。
  flutter_inappwebview_macos: ^1.2.0-beta.3 # 提供 InAppWebView 的 macOS 平台实现。
  flutter_inappwebview_android: # 提供 InAppWebView 的 Android 平台实现。
    git:
      url: https://github.com/pichillilorenzo/flutter_inappwebview.git
      ref: v6.2.0-beta.3
      path: flutter_inappwebview_android
  webview_windows: # 提供 Windows 平台的 WebView 容器实现。
    git:
      url: https://github.com/Predidit/flutter-webview-windows.git
      ref: 39c20a6fc5436988d7495a51a704056e4fca4751
  desktop_webview_window: # 在 Linux 桌面创建承载 WebView 的独立窗口。
    git:
      url: https://github.com/Predidit/linux_webview_window.git
      ref: b429f8ba6b8a99cd0f7eb5fe8d1621f325635c3d

  # 网络通信与文本解析
  dio: ^5.10.0 # 提供支持拦截器、取消请求和文件传输的 HTTP 客户端。
  cookie_jar: ^4.0.9 # 管理 HTTP Cookie，并支持 Cookie 持久化。
  crypto: ^3.0.6 # 提供常用密码学哈希、摘要和 HMAC 算法。
  html: ^0.15.6 # 将 HTML 文本解析为可遍历和操作的文档树。
  xpath_selector: ^3.0.2 # 使用 XPath 表达式查询 XML 或 HTML 文档节点。
  xpath_selector_html_parser: ^3.0.1 # 将 HTML 解析器接入 xpath_selector 查询流程。
  antlr4: ^4.13.2 # 提供 ANTLR 4 生成解析器所需的 Dart 运行时。

  # 状态管理与导航
  flutter_riverpod: ^3.2.1 # 将 Riverpod 状态管理与 Flutter widget 生命周期集成。
  riverpod_annotation: ^4.0.2 # 提供用于声明 Riverpod Provider 的注解。
  go_router: ^17.1.0 # 提供基于 URL 的声明式路由和导航。

  # 数据持久化与文件系统
  flutter_secure_storage: ^10.0.0 # 通过平台安全存储保存键值数据。
  hive_ce: ^2.19.3 # 提供轻量、基于键值的本地 NoSQL 数据库。
  hive_ce_flutter: ^2.3.4 # 提供 Hive 在 Flutter 中的初始化与路径适配。
  path_provider: ^2.1.5 # 获取平台相关的应用文档、缓存和临时目录。
  path: ^1.9.1 # 以跨平台方式拼接、拆分和规范化文件路径。
  gal: ^2.3.2 # 将图片保存到设备系统相册或图库。
  open_file: ^4.0.0 # 使用操作系统关联的默认应用打开文件。

  # 平台信息与系统集成
  package_info_plus: ^8.3.1 # 读取应用包名、版本号和构建号等元数据。
  file_picker: ^8.1.7 # 调用平台文件选择器选择文件或目录。
  flutter_foreground_task: ^11.0.1 # 提供在后台执行任务的插件。
  device_info_plus: ^11.3.0 # 读取设备型号、操作系统和平台相关信息。
  battery_plus: ^7.1.1 # 读取设备电池电量、充电状态和电池状态。
  connectivity_plus: ^6.0.5 # 查询网络连接类型并监听连接状态变化。
  window_manager: ^0.5.1 # 管理桌面应用窗口的尺寸、位置、状态和事件。
  url_launcher: ^6.3.2 # 调用平台应用打开 URL、电话号码、邮件等外部资源。
  flutter_opencc_plus: ^0.1.2 # 使用 OpenCC 在繁简中文及相关变体之间转换文本。
  logger: ^2.6.2 # 提供分级、可扩展的应用日志输出接口。
  synchronized: ^3.4.1+2 # 为异步代码提供互斥锁和同步执行机制。
  share_plus: ^12.0.2 # 调用平台原生分享面板分享文本、文件或 URI。

  # 文本与图像处理
  flutter_markdown_plus: ^1.0.7 # 将 Markdown 文本解析并渲染为 Flutter widget。
  image_picker: ^1.2.1 # 从设备相册选择图片或通过相机采集图片。
  crop_your_image: ^2.0.0 # 在 Flutter 中对图片进行交互式裁剪。


dependency_overrides:
  media_kit_libs_linux:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 994465d9bfca3f39d0b41199d16e7fd93fe97881
