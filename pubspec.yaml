# logo图标生成生成命令:dart run flutter_launcher_icons
flutter_launcher_icons:
  ios: true
  android: true
  linux: true
  windows:
    generate: true
  macos:
    generate: true
  image_path: "assets/image/logo/logo.webp"
  remove_alpha_ios: true  # 添加这一行来移除iOS图标的alpha通道
  adaptive_icon_background: "#FFFFFF"

# 启动logo: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#A0C4F5"
  image: assets/image/logo/logo.png
  android_12:
    # Android 12+ 会把启动图标裁剪成中心圆，使用预置好安全边距的专用图片。
    image: assets/image/logo/logo_android_12.png
    color: "#A0C4F5"
  android: true
  ios: true

dev_dependencies:
  # 测试与代码质量
  flutter_test: # 提供 Flutter widget、单元和集成测试工具。
    sdk: flutter
  flutter_lints: ^6.0.0 # 提供 Flutter 官方推荐的 Dart 静态检查规则。
  riverpod_lint: ^3.1.3 # 提供针对 Riverpod 用法的静态分析规则。

  # 代码生成
  build_runner: ^2.13.1 # 管理 Dart 构建脚本并运行代码生成任务。
  hive_ce_generator: 1.11.0 # 根据 Hive 模型注解生成 TypeAdapter 代码。
  riverpod_generator: ^4.0.3 # 根据 Riverpod 注解生成 Provider 代码。
  go_router_builder: ^4.3.0 # 根据路由定义生成类型安全的 go_router 代码。

  # 应用元数据与资源生成
  rename_app: ^1.6.5 # 修改 Flutter 应用在各平台上的显示名称。
  change_app_package_name: ^1.5.0 # 修改 Android 和 iOS 应用的包标识符。
  flutter_launcher_icons: ^0.14.4 # 根据配置为各平台生成应用启动图标。
  flutter_native_splash: ^2.4.7 # 根据配置生成各平台的原生启动画面。


