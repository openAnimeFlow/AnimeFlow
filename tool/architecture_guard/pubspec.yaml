
name: anime_flow_architecture_guard
description: Isolated architecture analysis and acceptance tests for AnimeFlow.
publish_to: none
environment:
  sdk: ">=3.13.0 <4.0.0"
dependencies:
  analyzer: 14.6.0 # 提供 Dart 源码解析、抽象语法树及符号和类型分析能力。
  glob: ^2.1.3 # 使用通配符模式匹配文件和目录路径。
  path: ^1.9.1 # 以跨平台方式拼接、拆分和规范化文件路径。
  yaml: ^3.1.3 # 解析 YAML 文本并提供结构化数据访问。
dev_dependencies:
  test: ^1.33.0 # 提供 Dart 单元测试、异步测试及断言工具。
  lints: ^6.0.0 # 提供 Dart 官方推荐的静态检查规则集。
